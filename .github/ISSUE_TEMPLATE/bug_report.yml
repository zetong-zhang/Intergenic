name: Bug report
description: Report a reproducible problem with Intergenic.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not include confidential or restricted genomic data. For security
        issues, follow SECURITY.md instead of opening a public issue.
  - type: input
    id: version
    attributes:
      label: Intergenic version
      description: Release version or commit hash.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system, compiler version, and whether zlib was enabled.
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command and sanitized inputs
      description: Include the exact command and a minimal reproducible input.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
      description: Include complete output or error text.
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I ran the latest version and searched existing issues.
          required: true
        - label: The data in this report can be shared publicly.
          required: true
