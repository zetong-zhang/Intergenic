name: Feature request
description: Propose a new capability or behavior.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Research or workflow problem
      description: Describe the problem before proposing an implementation.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Include input/output examples and coordinate conventions.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and related tools
      description: Explain existing tools or workarounds you considered.
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues and documentation.
          required: true
