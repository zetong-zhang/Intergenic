name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  platform-build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Stage install
        run: cmake --install build --config Release --prefix stage

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: intergenic-${{ matrix.os }}
          path: stage
          if-no-files-found: error

  compiler-matrix:
    name: Linux with ${{ matrix.compiler }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler:
          - g++
          - clang++
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes make g++ clang

      - name: Build
        env:
          CXX: ${{ matrix.compiler }}
        run: make clean all

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: intergenic-linux-${{ matrix.compiler }}
          path: intergenic
          if-no-files-found: error

  zlib-build:
    name: Linux with zlib
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes zlib1g-dev

      - name: Configure
        run: cmake -S . -B build-zlib -DCMAKE_BUILD_TYPE=Release -DINTERGENIC_USE_ZLIB=ON

      - name: Build
        run: cmake --build build-zlib --config Release

      - name: Verify gzip input
        shell: bash
        run: |
          plain="${RUNNER_TEMP}/plain.gff"
          gzipped="${RUNNER_TEMP}/gzipped.gff"
          gzip -c example.fa > "${RUNNER_TEMP}/example.fa.gz"
          gzip -c example.gff > "${RUNNER_TEMP}/example.gff.gz"
          ./build-zlib/intergenic -q -i example.fa -a example.gff -o "${plain}"
          ./build-zlib/intergenic -q -i "${RUNNER_TEMP}/example.fa.gz" \
            -a "${RUNNER_TEMP}/example.gff.gz" -o "${gzipped}"
          cmp \
            <(grep -v '^#' "${plain}") \
            <(grep -v '^#' "${gzipped}")

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: intergenic-linux-zlib
          path: build-zlib/intergenic
          if-no-files-found: error
